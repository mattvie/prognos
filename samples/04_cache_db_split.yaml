openapi: 3.0.0
info:
  title: Dashboard Aggregator (Tráfego Multiplicado)
  version: 2.0.0
  description: Rota que faz muitas chamadas rápidas em cache e poucas lentas no DB.
x-service-performance:
  instances: 3
  worker_type: memory-optimized
paths:
  /stats:
    get:
      summary: Carregamento do painel
      x-performance:
        processing_time:
          distribution: exponential
          mean_ms: 45
        dependencies:
          - service: redis-cache
            calls: 4
          - service: postgresql-db
            calls: 1
      responses:
        '200':
          description: OK
